name: Aggiorna contatore download

on:
  schedule:
    - cron: '0 */6 * * *'   # ogni 6 ore
  workflow_dispatch:          # permette anche di lanciarlo manualmente da GitHub

jobs:
  update-downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Genera downloads.json
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node scripts/fetch-downloads.js

      - name: Commit e push se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads.json
          git diff --staged --quiet || git commit -m "Aggiorna contatore download automaticamente"
          git push